# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller
    - torso_controller
    - head_controller

  arm_controller:
    type: FollowJointTrajectory
    joints:
      - arm_1_joint
      - arm_2_joint
      - arm_3_joint
      - arm_4_joint
      - arm_5_joint
      - arm_6_joint
      - arm_7_joint
    action_ns: follow_joint_trajectory
    default: true
  gripper_controller:
    type: FollowJointTrajectory
    joints:
      - gripper_left_finger_joint
      - gripper_right_finger_joint
    action_ns: follow_joint_trajectory
    default: true
  torso_controller:
    type: FollowJointTrajectory
    joints:
      - torso_lift_joint
    action_ns: follow_joint_trajectory
    default: true
  head_controller:
    type: FollowJointTrajectory
    joints:
      - head_1_joint
      - head_2_joint
    action_ns: follow_joint_trajectory
    default: true